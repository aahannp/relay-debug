name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.9.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # macOS runners default to bash; Relay's shells and npm run check expect the user's shell to be zsh
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm

      # npm run check spawns zsh; fail loudly here rather than deep inside the check
      - name: Require zsh
        run: command -v zsh

      - run: npm ci
      - run: npm run check
      # --publish never: electron-builder would otherwise publish by itself on a tag build in CI
      # The early-access repo builds "Relay Debug" from the same commits; every other repo builds Relay.
      - name: Build
        run: |
          if [ "$GITHUB_REPOSITORY" = "aahannp/relay-debug" ]; then npm run dist:debug -- --publish never; else npm run dist -- --publish never; fi

      - name: Name the DMG and check the tag
        id: dmg
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').productName.replace(/ /g, '-')")
          [ "$GITHUB_REPOSITORY" = "aahannp/relay-debug" ] && name=Relay-Debug
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi
          shopt -s nullglob
          found=(dist/*.dmg)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one dist/*.dmg, found ${#found[@]}: ${found[*]:-none}"
            exit 1
          fi
          dmg="dist/${name}-${version}-arm64.dmg"
          [ "${found[0]}" = "$dmg" ] || mv "${found[0]}" "$dmg"
          hash=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          # checksum file lists the bare filename so `shasum -a 256 -c` works next to the download
          (cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.dmg.outputs.path }}

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
          HASH: ${{ steps.dmg.outputs.hash }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          if [ "$GITHUB_REPOSITORY" = "aahannp/relay-debug" ]; then early='Early access build. It may change faster than Relay and have rough edges.'; else early=; fi
          gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          # drop any block from a previous run so re-runs don't stack notes
          body=$(gh release view "$TAG" --json body --jq .body | sed '/^<!-- verify:start -->$/,/^<!-- verify:end -->$/d')
          {
            [ -z "$early" ] || printf '%s\n\n' "$early"
            printf '%s\n\n' "$body"
            echo '<!-- verify:start -->'
            echo "SHA-256: $HASH"
            echo
            echo '```'
            echo "gh attestation verify $(basename "$DMG") -R $GITHUB_REPOSITORY"
            echo '```'
            echo '<!-- verify:end -->'
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
