<!doctype html>
<!-- Relay app icon, drawn on Apple's 1024 grid: an 824px tile centred on a transparent canvas.
     #small (32 point icons) and #tiny (16 pixels) use the heavier mark, drawn larger, so the orbit survives.
     #touch is the full-bleed square for the website's apple-touch-icon, which iOS rounds itself.
     ?debug draws Relay Debug's icon: the black mark on an amber tile, so the two apps differ at a glance. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
<svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
const size = location.hash.slice(1) || 'full';
const full = size === 'full';
const debug = new URLSearchParams(location.search).has('debug');

// Rounded rectangle with Apple-style continuous corners (Figma's corner smoothing, 60%).
function squircle(x, y, w, h, r, smoothing = 0.6) {
  const rad = deg => deg * Math.PI / 180;
  const p = (1 + smoothing) * r;
  const arc = 90 * (1 - smoothing);
  const L = Math.sin(rad(arc / 2)) * r * Math.SQRT2;
  const c = r * Math.tan(rad((90 - arc) / 4)) * Math.cos(rad(45 * smoothing));
  const d = c * Math.tan(rad(45 * smoothing));
  const b = (p - L - c - d) / 3;
  const n = v => +v.toFixed(3);
  const [A, AB, ABC, C, D, BC, l] = [2 * b, 3 * b, 3 * b + c, c, d, b + c, L].map(n);
  return `M ${n(x + w - p)} ${y}
    c ${A} 0 ${AB} 0 ${ABC} ${D} a ${r} ${r} 0 0 1 ${l} ${l} c ${D} ${C} ${D} ${BC} ${D} ${ABC} L ${x + w} ${n(y + h - p)}
    c 0 ${A} 0 ${AB} ${-D} ${ABC} a ${r} ${r} 0 0 1 ${-l} ${l} c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D} L ${n(x + p)} ${y + h}
    c ${-A} 0 ${-AB} 0 ${-ABC} ${-D} a ${r} ${r} 0 0 1 ${-l} ${-l} c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC} L ${x} ${n(y + p)}
    c 0 ${-A} 0 ${-AB} ${D} ${-ABC} a ${r} ${r} 0 0 1 ${l} ${-l} c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D} Z`;
}

const touch = size === 'touch';
const tile = touch ? 'M 0 0 H 1024 V 1024 H 0 Z' : squircle(100, 100, 824, 824, 185);

// The mark is an SVG drawn in currentColor, which an image renders black; invert turns it white on the ink tile.
const [mark, box] = touch ? ['relay-mark.svg', 760] : full ? ['relay-mark.svg', 640] : ['relay-mark-bold.svg', size === 'tiny' ? 780 : 740];
const at = 512 - box / 2;

document.getElementById('icon').innerHTML = `
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
  </filter>
</defs>

<!-- Flat colours only: an ink tile and the white mark (amber and black for Relay Debug). -->
<g filter="${touch ? '' : 'url(#shadow)'}"><path d="${tile}" fill="${debug ? '#f5a524' : '#0f0e14'}"/></g>
<image href="${mark}" x="${at}" y="${at}" width="${box}" height="${box}" style="filter: invert(${debug ? 0 : 1})"/>
${full ? `<path d="${tile}" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>` : ''}`;
</script>
